<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSXDrawing library example</title>
    <link rel="stylesheet" href="../dist_lib/jsxdrawing.min.css" />
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; background: #fff; }
      h2 { text-align: center; margin: 48px 0 16px; }
    </style>
  </head>
  <body>
    <!-- 1) Props from a JSON file. Needs the page to be served over http(s)
         (browsers block fetch() from file://), e.g. `npx serve dist_lib`. -->
    <h2>1. Props from question1.json</h2>
    <div data-drawing-app data-props-src="question1.json"></div>

    <!-- 2) Props inline as JSON. Works even when opening the file directly. -->
    <h2>2. Inline JSON props</h2>
    <div data-drawing-app>
      <script type="application/json">
        {
          "questionText": "Sara has $80 to spend on pizza (x-axis) and books (y-axis); each costs $10.\n\nDraw her budget line.",
          "boundingBox": [-1, 11, -1, 11],
          "xLabel": "Pizza",
          "yLabel": "Books",
          "width": 600,
          "height": 600,
          "enabledTools": ["select", "segment", "scatter", "text", "eraser"],
          "expectedDrawing": [{ "type": "segment", "yIntercept": 8, "slope": -1, "tolerance": 0.1 }],
          "suggestedAnswer": [{ "type": "segment", "points": [[0, 8], [8, 0]], "color": "#eb2525" }]
        }
      </script>
    </div>

    <!-- 3) From JavaScript. -->
    <h2>3. JSXDrawing.mount()</h2>
    <div id="q3"></div>

    <script src="../dist_lib/jsxdrawing.min.js"></script>
    <script>
      JSXDrawing.mount("#q3", {
        questionText: "Draw any connected scatter plot.",
        boundingBox: [-1, 11, -1, 11],
        width: 500,
        height: 500,
        enabledTools: ["select", "scatter", "eraser"],
        showGradeButton: false,
      });
      // Or: JSXDrawing.mountFromUrl("#q3", "question1.json");
    </script>
  </body>
</html>

project:
  type: website
  # The quiz files are loaded by the browser at run time, so Quarto must copy them.
  resources:
    - quiz1.js
    - questions/**
    - assets/**

website:
  title: "Exercise system demo"

format:
  html:
    css: assets/exercise-system.css
    # Mounts every <div class="exercise-system-root" data-quiz="FILE.js"> on a page.
    # Add `data-review` to a div for the teacher view (load a results file, grade essays).
    include-in-header:
      text: |
        <script type="module">
          const roots = document.querySelectorAll("[data-quiz]:not([data-mounted])");
          if (roots.length > 0) {
            const { mount } = await import("./assets/exercise-system.js");
            for (const el of roots) {
              el.dataset.mounted = "";
              try {
                const { assessment, questions } = await import(`./${el.dataset.quiz}`);
                mount(el, { assessment, questions, review: "review" in el.dataset });
              } catch (err) {
                el.textContent = `Could not load the quiz (${el.dataset.quiz}): ${err.message}`;
                console.error(err);
              }
            }
          }
        </script>
